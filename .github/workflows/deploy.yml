name: Deploy production

# Simulated deployment of the static site. The GitHub environment makes each run a GitHub Deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com
      - name: Deploy (simulated)
        run: echo "Publishing dist/ for ${GITHUB_SHA::7} to production"
